name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t sampada011998/my-docker-website:latest .

      - name: Push Docker image
        run: docker push sampada011998/my-docker-website:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull sampada011998/my-docker-website:latest
            docker stop my-docker-website || true
            docker rm my-docker-website || true
            docker run -d --name my-docker-website -p 80:80 sampada011998/my-docker-website:latest